<template id="new-instance-header">
  <div class="gisst-New-instance-header">
    <h1>Add Work</h1>
    <hr />

    <div class="gisst-New-instance-description">
      <p>You can find bibliographic data by:</p>

      <ol class="gisst-New-instance-description-list">
        <li>
          Searching for a similar existing work already in the GISST system, OR
        </li>
        <li>
          Attempt to match your content file against a community-developed
          database.
        </li>
      </ol>
      <p>
        Using either method will populate the work details below, or you can
        skip both methods and create a new work by hand.
      </p>
    </div>
  </div>
</template>

<template id="new-instance-method-one">
  <div class="gisst-New-instance-search-container">
    <h4>Method 1:</h4>
    <p>
      Search for an existing instance (you can change the work details or
      content files later).
    </p>

    <div id="new-instance-search-box"></div>

    <div class="gisst-Search-results-header gisst-New-instance-search-header">
      <div
        class="gisst-Search-header-cell gisst-New-instance-search-header-description"
      >
        Description
      </div>
      <div
        class="gisst-Search-header-cell gisst-New-instance-search-header-platform"
      >
        Platform
      </div>
      <div
        class="gisst-Search-header-cell gisst-New-instance-search-header-version"
      >
        Version
      </div>
    </div>

    <div class="gisst-Search-table-view">
      <div
        id="new-instance-results-box"
        class="gisst-Search-results-body"
      ></div>
    </div>
  </div>
</template>

<template id="new-instance-method-two">
  <div class="gisst-New-instance-method-two-container">
    <h4>Method 2:</h4>
    <div class="gisst-New-instance-method-two-contents">
      <div>
        <label for="match_core_chooser">What platform is this work for?</label>
        <select name="match_core_chooser" class="core_chooser">
          <option value="(init)">Select core...</option>
        </select>
      </div>
      <div>
        <div class="gisst-New-instance-content-search-container">
          <p>Search using the given main content file:</p>
          <input
            type="file"
            id="content-match-upload"
            class="content-match-upload gisst-New-instance-visually-hidden"
          />
          <label
            for="content-match-upload"
            class="gisst-Instance-btn gisst-Search-btn-primary"
            >Browse...</label
          >
          <p class="content-file-name">No file chosen</p>
        </div>
        <p class="content_match_result"></p>
      </div>
    </div>
  </div>
</template>

<template id="new-instance-details-form">
  <form id="work-info" class="gisst-New-instance-details-container">
    <div class="gisst-New-instance-details-row">
      <div>
        <h4>Work details:</h4>
        <p>
          <label for="work_core_chooser">Platform:</label>
          <select name="work_core_chooser" class="core_chooser"></select>
        </p>
        <p>
          <label for="work_name">Name:</label>
          <input name="work_name" required />
        </p>
        <p>
          <label for="work_version">Version:</label>
          <input name="work_version" />
        </p>
      </div>

      <div>
        <p class="gisst-New-instance-header-files">Select files:</p>
        <p>
          <input
            type="file"
            id="instance-dep-upload"
            name="instance_dep_upload"
            class="instance-file-upload gisst-New-instance-visually-hidden"
            data-target="dependency"
          />
          <label
            for="instance-dep-upload"
            class="gisst-Instance-btn gisst-Search-btn-primary"
            >+ Add instance dependency</label
          >
        </p>
        <ol class="gisst-New-instance-select-file-lists"></ol>
        <p>
          <input
            type="file"
            id="instance-config-upload"
            name="instance_config_upload"
            class="instance-file-upload gisst-New-instance-visually-hidden"
            data-target="config"
          />
          <label
            for="instance-config-upload"
            class="gisst-Instance-btn gisst-Search-btn-primary"
            >+ Add instance config files</label
          >
        </p>
        <ol class="gisst-New-instance-select-file-lists"></ol>
        <p>
          <input
            type="file"
            id="instance-content-upload"
            name="instance_content_upload"
            class="instance-file-upload gisst-New-instance-visually-hidden"
            data-target="content"
          />
          <label
            for="instance-content-upload"
            class="gisst-Instance-btn gisst-Search-btn-primary"
            >+ Add instance content files</label
          >
        </p>
        <ol class="gisst-New-instance-select-file-lists"></ol>
      </div>
    </div>
  </form>
</template>

<template id="new-instance-config-form">
  <div
    class="gisst-New-instance-details-row gisst-New-instance-environment-container"
  >
    <p>Please select a configuration method:</p>
    <div class="gisst-New-instance-config-btns gisst-New-instance-tabs">
      <div
        class="gisst-New-instance-tab-btns"
        role="tablist"
        aria-label="config-method"
      >
        <button
          class="gisst-Instance-btn gisst-Search-btn-primary"
          role="tab"
          aria-selected="true"
          aria-controls="panel-1"
          id="tab-1"
          tabindex="0"
          data-mode="form"
        >
          Form
        </button>
        <button
          class="gisst-Instance-btn gisst-Search-btn-primary"
          role="tab"
          aria-selected="false"
          aria-controls="panel-2"
          id="tab-2"
          tabindex="-1"
          data-mode="manual"
        >
          Manual entry
        </button>
      </div>
      <div class="tab-panels">
        <div
          id="panel-1"
          role="tabpanel"
          tabindex="0"
          aria-labelledby="tab-1"
        ></div>
        <div
          id="panel-2"
          role="tabpanel"
          tabindex="0"
          aria-labelledby="tab-2"
          hidden
        ></div>
      </div>
    </div>
  </div>
</template>

<template id="new-instance-submit">
  <div>
    <button
      class="submit gisst-Instance-btn gisst-Search-btn-primary"
      type="button"
    >
      Create Instance
    </button>
    <p class="submit-status"></p>
  </div>
</template>

<!-- config method panels (for tabs) -->

<template id="config-form-panel">
  <div>
    <div class="gisst-New-instance-config-body">
      <form class="gisst-New-instance-config-form">
        <!-- <h4 class="gisst-New-instance-config-form-headers">Images</h4> -->
        <div class="gisst-New-instance-disk-file-selectors">
          <div
            class="gisst-New-instance-content-search-container gisst-New-instance-disk-file-select"
          >
            <div>
              <p>Hard disk A:</p>
            </div>
            <div>
              <input
                type="file"
                name="hda"
                id="hard-disk-a-upload"
                class="content-match-upload gisst-New-instance-visually-hidden"
              />
              <label
                for="hard-disk-a-upload"
                class="gisst-Instance-btn gisst-Search-btn-primary"
                >Browse...</label
              >
              <p class="content-file-name">No file chosen</p>
            </div>
          </div>
          <div
            class="gisst-New-instance-content-search-container gisst-New-instance-disk-file-select"
          >
            <div>
              <p>Hard disk B:</p>
            </div>
            <div>
              <input
                type="file"
                name="hdb"
                id="hard-disk-b-upload"
                class="content-match-upload gisst-New-instance-visually-hidden"
              />
              <label
                for="hard-disk-b-upload"
                class="gisst-Instance-btn gisst-Search-btn-primary"
                >Browse...</label
              >
              <p class="content-file-name">No file chosen</p>
            </div>
          </div>
          <div
            class="gisst-New-instance-content-search-container gisst-New-instance-disk-file-select"
          >
            <div>
              <p>Floppy A:</p>
            </div>
            <div>
              <input
                type="file"
                name="fda"
                id="floppy-a-upload"
                class="content-match-upload gisst-New-instance-visually-hidden"
              />
              <label
                for="floppy-a-upload"
                class="gisst-Instance-btn gisst-Search-btn-primary"
                >Browse...</label
              >
              <p class="content-file-name">No file chosen</p>
            </div>
          </div>
          <div
            class="gisst-New-instance-content-search-container gisst-New-instance-disk-file-select"
          >
            <div>
              <p>Floppy B:</p>
            </div>
            <div>
              <input
                type="file"
                name="fdb"
                id="floppy-b-upload"
                class="content-match-upload gisst-New-instance-visually-hidden"
              />
              <label
                for="floppy-b-upload"
                class="gisst-Instance-btn gisst-Search-btn-primary"
                >Browse...</label
              >
              <p class="content-file-name">No file chosen</p>
            </div>
          </div>
          <div
            class="gisst-New-instance-content-search-container gisst-New-instance-disk-file-select"
          >
            <div>
              <p>CD-ROM:</p>
            </div>
            <div>
              <input
                type="file"
                name="cdrom"
                id="cd-rom-upload"
                class="content-match-upload gisst-New-instance-visually-hidden"
              />
              <label
                for="cd-rom-upload"
                class="gisst-Instance-btn gisst-Search-btn-primary"
                >Browse...</label
              >
              <p class="content-file-name">No file chosen</p>
            </div>
          </div>
        </div>

        <hr />

        <!-- <h4 class="gisst-New-instance-config-form-headers">Memory</h4> -->

        <div class="gisst-New-instance-memory-and-gpu-size">
          <div class="gisst-New-instance-memory-size-select">
            <div>
              <label for="memory-size-select">Memory size:</label>
            </div>
            <div>
              <input
                id="memory-size-select"
                type="number"
                name="mem-size"
                step="16"
                min="16"
                max="1024"
              />
              MiB
            </div>
          </div>
          <div class="gisst-New-instance-gpu-memory-select">
            <div>
              <label for="gpu-memory-select">GPU memory size:</label>
            </div>
            <div>
              <input
                id="gpu-memory-select"
                type="number"
                name="gpu-memory"
                step="1"
                min="16"
                max="1024"
              />
              MiB
            </div>
          </div>
        </div>

        <hr />

        <!-- <h4 class="gisst-New-instance-config-form-headers">BIOS</h4> -->

        <div class="gisst-New-instance-bios-select">
          <fieldset>
            <legend>BIOS:</legend>
            <div>
              <input
                type="radio"
                id="bios-seabios"
                name="bios"
                value="bios-seabios"
                checked
              />
              <label for="bios-seabios">Seabios</label>
            </div>
            <div>
              <input
                type="radio"
                id="bios-bochs"
                name="bios"
                value="bios-bochs"
              />
              <label for="bios-bochs">Bochs</label>
            </div>
          </fieldset>
          <fieldset>
            <legend>VGA BIOS:</legend>
            <div>
              <input
                type="radio"
                id="vga-bios-standard"
                name="vga-bios"
                value="vga-bios-standard"
                checked
              />
              <label for="vga-bios-standard">Standard</label>
            </div>
            <div>
              <input
                type="radio"
                id="vga-bios-bochs"
                name="vga-bios"
                value="vga-bios-bochs"
              />
              <label for="vga-bios-bochs">Bochs</label>
            </div>
          </fieldset>
        </div>
      </form>

      <div class="gisst-New-instance-environment">
        <label class="gisst-New-instance-label-env-conf" for="env-config-form"
          >Environment config:</label
        >
        <textarea id="env-config-form" name="env_config" disabled></textarea>
      </div>
    </div>
  </div>
</template>

<template id="config-manual-entry-panel">
  <div>
    <div
      class="gisst-New-instance-environment gisst-New-instance-config-manual"
    >
      <label class="gisst-New-instance-label-env-conf" for="env-config-manual"
        >Environment config:</label
      >
      <textarea id="env-config-manual" name="env_config"></textarea>
    </div>
  </div>
</template>
