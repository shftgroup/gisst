[package]
name = "ra-video-worker"
version.workspace = true
edition.workspace = true

[dependencies]
rply-codec = {git="https://github.com/JoeOsborn/rply-codec/",rev="8cab86a2ade9cead90446db615788a79e67f3093"}
retro-rs = { version = "0.5.6", default-features=false }
ffmpeg-next = "8.0.0"
ringbuf = "0.5.2"
reqwest = "0.13.4"
tokio = { version = "1.53.1", features = ["full"] }
clap = { version = "4.6.3", features = ["cargo", "default", "derive", "env"] }
clap-verbosity-flag = "3.0.4"
anyhow = "1.0.104"
env_logger = "0.11.11"
log = "0.4.33"
serde_json = "1.0.151"
