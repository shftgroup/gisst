[database]
database_url = "postgresql://postgres:postgres@db:5432/gisstdb"

[http]
listen_address = "0.0.0.0"
listen_port = 3030
base_url = "https://ultra64.cs.pomona.edu/gisst-test/$BRANCH"
dev_ssl = false

[env]
jaeger_endpoint = "http://jaeger:4317/"
prometheus_endpoint = "http://prometheus:9090/"

[search]
meili_url = "http://meili:7700"
meili_external_url = "https://ultra64.cs.pomona.edu/$ROOT/$BRANCH/search"
meili_api_key = "devcontainer_testkey"
meili_search_key = "devcontainer_testkey"

[auth]
task_worker_keys = ["$WORKER_KEY"]
google_client_id="$GOOGLE_CLIENT_ID"
google_client_secret="$GOOGLE_CLIENT_SECRET"
